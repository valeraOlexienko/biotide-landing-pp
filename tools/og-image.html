<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Biotide social card</title>
<!-- 1200x630 social preview (og:image / twitter:image). Rendered to images/og-image.png by
     tools/render_og.sh with headless Chrome. Dark stage in the brand's ink colour, the brand,
     one headline, one line, the URL, and a real app screen on the right. Re-render whenever
     the headline, palette or hero screen changes. -->
<style>
    @font-face { font-family: "Instrument Sans"; font-weight: 400 700; src: url("../fonts/instrument-sans-latin.woff2") format("woff2"); }
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { background: #151a22; color: #f5f6f8; font-family: "Instrument Sans", -apple-system, sans-serif; position: relative; }
    .text { position: absolute; left: 72px; top: 88px; width: 640px; }
    .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 40px; opacity: 0.9; }
    .brand img { width: 44px; height: 44px; border-radius: 10px; }
    h1 { font-size: 64px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.02; margin-bottom: 26px; }
    p { font-size: 25px; line-height: 1.35; color: rgba(245, 246, 248, 0.78); }
    .url { position: absolute; left: 72px; bottom: 56px; font-size: 22px; opacity: 0.7; }
    .phone { position: absolute; right: 72px; top: 70px; width: 330px; border-radius: 40px; filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.45)); }
</style>
</head>
<body>
<div class="text">
    <div class="brand"><img src="../images/logo.png" alt="">Biotide</div>
    <h1>Daily Biorhythm Chart & Energy Tracker</h1>
    <p>A daily biorhythm chart and energy tracker for iPhone and iPad that tests the three cycles against how you feel, with compatibility and best days.</p>
</div>
<div class="url">biotide.app</div>
<img class="phone" src="../images/placeholder-screen.png" alt="">
</body>
</html>
